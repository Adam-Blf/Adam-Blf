name: profile-svg

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_profile_svg.py"
      - "assets/terminal.template.svg"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_svg.py

      - name: Commit if changed
        run: |
          git config user.name "Adam Beloucif"
          git config user.email "adam.beloucif@efrei.net"
          if ! git diff --quiet assets/; then
            git add assets/terminal-dark.svg assets/terminal-light.svg
            git commit -m "chore: refresh profile stats svg"
            git push
          else
            echo "No change"
          fi
